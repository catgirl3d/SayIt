[env]
# MSVC on Chinese Windows uses the system code page (GBK) by default to read source files,
# but comments in transcribe.cpp's src/arch/canary/model.cpp contain UTF-8 character ▁ (U+2581).
# When decoded as GBK, those three bytes swallow the newline, leaving the comment unclosed ->
# triggering dozens of cascading C2065/C3927/C4430 errors.
# CL is the environment variable recognized by MSVC for prepending compiler options. Using it
# to add /utf-8 to all C/C++ builds is safer than modifying CMAKE_CXX_FLAGS (which would wipe out
# crate-defined flags like /EHsc -W0).
CL = "/utf-8"

# The vulkan feature of transcribe-cpp relies on the Vulkan SDK to compile SPIR-V shaders,
# which CMake looks for via VULKAN_SDK. The SDK installer writes it to Machine environment
# variables, but currently running shells inherit the old environment block, causing `tauri dev`
# or `cargo build` to fail finding it with:
#   Could NOT find Vulkan (missing: Vulkan_LIBRARY Vulkan_INCLUDE_DIR glslc)
# Defined here as a fallback: cargo's [env] by default does NOT override existing environment
# variables of the same name (force defaults to false), so external/CI provided VULKAN_SDK
# takes precedence, and this entry only takes effect when missing.
# Update this line when changing SDK versions or machines (if the path does not exist, behavior
# is identical to SDK not being installed).
VULKAN_SDK = "C:\\VulkanSDK\\1.4.357.0"

# Force tests to run serially. Real-device model tests (gguf_asr / local_asr / test_audio)
# share a single global engine (CACHE mutex lock). Running them in parallel causes test A's
# timing to include waiting for test B's inference to finish, leading to false assertion
# failures in report_backend_and_rtf / first_transcribe_after_load_*, or reading backend=None
# after another test unloads it. The overhead of running serially is ~0: inference is already
# serialized by the lock, and pure logic tests finish in milliseconds.
RUST_TEST_THREADS = "1"
