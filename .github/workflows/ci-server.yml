name: Server checks

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/ci-server.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/ci-server.yml'
  workflow_dispatch: {}

concurrency:
  group: ci-server-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Matches the Ubuntu 22.04 base image in server/backend/Dockerfile.
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            server/backend/requirements.txt
            server/backend/requirements-test.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-test.txt

      - name: Run backend tests
        run: python -m pytest backend/tests -q

      - name: Install Ruff
        run: python -m pip install ruff==0.17.2

      # Advisory baseline: the server code predates this workflow and has existing
      # findings. Keep measuring them without blocking merges; make it a hard gate
      # only after a baseline decision, like the Rust clippy step.
      - name: Ruff baseline (advisory)
        continue-on-error: true
        run: ruff check --config ruff.toml .

  gateway:
    name: Gateway tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    defaults:
      run:
        working-directory: server/gateway

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Matches the node:20-alpine gateway image.
          node-version: 20

      - name: Run gateway tests
        run: node --test static-path.test.mjs
