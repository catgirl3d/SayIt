name: Frontend checks

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - '!client/src-tauri/**'
      # The frontend build reads this file through vite.config.ts (__APP_VERSION__),
      # so re-include it after the src-tauri exclusion.
      - 'client/src-tauri/tauri.conf.json'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    paths:
      - 'client/**'
      - '!client/src-tauri/**'
      - 'client/src-tauri/tauri.conf.json'
      - '.github/workflows/ci-frontend.yml'
  workflow_dispatch: {}

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Lint, i18n, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check i18n resources
        run: npm run i18n:check

      - name: Test release scripts
        run: npm run test:scripts

      - name: Run unit tests
        run: npm test

      - name: Build frontend
        run: npm run build
