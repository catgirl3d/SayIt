name: Bug report
description: Report a reproducible problem in SayIt
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve SayIt.

        GitHub issues and attachments are public. Do not include passwords, API keys, tokens, personal data, private audio, or other sensitive information.

  - type: textarea
    id: problem
    attributes:
      label: Problem description
      description: Describe what went wrong and what you observed.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: List the smallest set of steps that reproduces the problem.
      placeholder: |
        1. Open...
        2. Select...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS version, SayIt version, voice engine, and relevant provider or model details.
    validations:
      required: false

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics bundle
      description: If requested by a maintainer, attach a diagnostics bundle after reviewing it and removing secrets or personal data.
    validations:
      required: false

  - type: checkboxes
    id: public-disclosure
    attributes:
      label: Public disclosure
      options:
        - label: I understand that this issue and its attachments will be public, and I have removed secrets and personal data.
          required: true
